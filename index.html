<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bai — Thai Immersion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEBF3; --surface:#FFFFFF; --surface-2:#F5F1F8; --ink:#241C2E;
  --ink-soft:#6C6478; --ink-faint:#9A93A6; --line:#E7E1ED;
  --gold:#D99A2B; --gold-soft:#F7E9C6; --rose:#DE685C; --brand:#2E2A6B;
  --video:#15111D; --video-ink:#F4EFF8; --shadow:rgba(36,28,46,.16);
  --w0:#2FA39B; --w1:#7C6BD8; --w2:#D98A2B; --w3:#D65E79; --w4:#4C9E52; --w5:#3E82C9;
  --w-alpha:.16;
  --font-display:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --font-thai:"IBM Plex Sans Thai","Kanit",system-ui,sans-serif;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme:dark){
    --bg:#0C0A11; --surface:#191320; --surface-2:#221A2E; --ink:#F3EEF8;
    --ink-soft:#A89FB4; --ink-faint:#786F86; --line:#2E2639; --gold:#ECB24A;
    --gold-soft:#3A2E17; --rose:#EE7A6E; --video:#0B0910; --shadow:rgba(0,0,0,.5);
    --w-alpha:.26; --brand:#A7A2F2;
    --w0:#3FC4BA; --w1:#9585EA; --w2:#EDB24A; --w3:#EE7C93; --w4:#67C06D; --w5:#5E9EE0;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0A11; --surface:#191320; --surface-2:#221A2E; --ink:#F3EEF8;
  --ink-soft:#A89FB4; --ink-faint:#786F86; --line:#2E2639; --gold:#ECB24A;
  --gold-soft:#3A2E17; --rose:#EE7A6E; --video:#0B0910; --shadow:rgba(0,0,0,.5);
  --w-alpha:.26; --brand:#A7A2F2;
  --w0:#3FC4BA; --w1:#9585EA; --w2:#EDB24A; --w3:#EE7C93; --w4:#67C06D; --w5:#5E9EE0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer}
input{font-family:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 24px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:-.015em;display:flex;align-items:center;gap:9px;flex:0 0 auto}
.logo .mark{width:30px;height:30px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:#fff;font-family:var(--font-thai);font-size:15px;font-weight:600}
.topsearch{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.topsearch svg{color:var(--ink-faint);flex:0 0 auto}
.topsearch input{border:none;background:none;outline:none;width:100%;font-size:15px;color:var(--ink)}
.topsearch input::placeholder{color:var(--ink-faint)}
.topbar .spacer{flex:1}
.iconbtn{background:var(--surface-2);border:1px solid var(--line);width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--ink);flex:0 0 auto}

.wrap{max-width:1200px;margin:0 auto;padding:24px}

.paste{display:flex;align-items:center;gap:12px;background:linear-gradient(110deg,var(--gold-soft),transparent);border:1px dashed color-mix(in srgb,var(--gold) 40%,transparent);border-radius:14px;padding:14px 16px;margin-bottom:22px}
.paste .ic{width:36px;height:36px;border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--gold);flex:0 0 auto;border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.paste .txt{min-width:0;flex:1}
.paste .txt b{font-family:var(--font-display);font-size:13.5px;font-weight:600;display:block}
.paste .txt input{border:none;background:none;outline:none;width:100%;font-size:13.5px;color:var(--ink);margin-top:2px}
.paste .txt input::placeholder{color:var(--ink-faint)}
.paste .go{border:none;background:var(--gold);color:#231a06;font-family:var(--font-display);font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:11px;flex:0 0 auto;white-space:nowrap}

.chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-family:var(--font-display);font-weight:500;font-size:13px;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.rowhead{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.rowhead h3{margin:0;font-family:var(--font-display);font-weight:600;font-size:17px}
.rowhead span{font-size:12.5px;color:var(--ink-faint)}
.rowhead .link{background:none;border:none;color:var(--brand);font-weight:600;font-size:12.5px;padding:0;font-family:var(--font-body)}

.channels{display:flex;gap:22px;flex-wrap:wrap}
.channel{width:78px;text-align:center;border:none;background:none;padding:0}
.channel .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:16px;margin:0 auto 6px;box-shadow:0 6px 16px -6px var(--shadow)}
.channel small{font-size:11.5px;color:var(--ink-soft);line-height:1.2;display:block}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{border:none;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:9px;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;color:#fff;box-shadow:0 8px 22px -12px var(--shadow)}
.thumb .g{position:absolute;inset:0}
.thumb .th-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .g::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 22px);mix-blend-mode:overlay}
.thumb .lvl{position:absolute;left:8px;top:8px;background:rgba(10,8,14,.6);backdrop-filter:blur(4px);color:#fff;font-family:var(--font-display);font-weight:700;font-size:11px;padding:3px 8px;border-radius:8px}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(10,8,14,.8);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:7px;font-variant-numeric:tabular-nums}
.thumb .subs{position:absolute;left:8px;bottom:8px;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:7px}
.subs.th{background:rgba(79,158,82,.92);color:#fff}
.subs.ai{background:rgba(217,138,43,.92);color:#231a06}
.card .ti{font-family:var(--font-thai);font-weight:500;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ch{font-size:12px;color:var(--ink-faint);margin-top:1px}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-faint);font-size:14px;padding:40px 10px}

.pback{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-family:var(--font-display);font-weight:500;font-size:13.5px;margin-bottom:16px}
.player-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px;align-items:start}
@media (max-width:920px){.player-grid{grid-template-columns:1fr}}
.video{position:relative;border-radius:16px;overflow:hidden;background:var(--video);aspect-ratio:16/9;color:var(--video-ink);isolation:isolate;box-shadow:0 12px 30px -14px var(--shadow)}
.ytholder{display:none;position:absolute;inset:0}
.ytholder iframe{width:100%;height:100%;border:0;display:block}
.video.real .scene,.video.real .yt,.video.real .play,.video.real .caption{display:none}
.video.real .ytholder{display:block}
.video .scene{position:absolute;inset:0}
.video .scene::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 24px);mix-blend-mode:overlay}
.video .yt{position:absolute;top:12px;left:14px;display:flex;align-items:center;gap:6px;font-size:12px;opacity:.85;font-family:var(--font-display)}
.video .yt .rec{width:8px;height:8px;border-radius:50%;background:#ff5252}
.video .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:none;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;box-shadow:0 8px 26px rgba(0,0,0,.35)}
.video .play svg{margin-left:3px}
.video .caption{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 16px;background:linear-gradient(to top,rgba(10,8,14,.86),rgba(10,8,14,.15) 75%,transparent);font-family:var(--font-thai);font-size:20px;font-weight:500;text-align:center}
.video .caption .cap-en{display:block;font-family:var(--font-body);font-size:12.5px;font-weight:400;opacity:.72;margin-top:4px}
.subsource{margin-top:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.subsource .tagd{font-family:var(--font-display);font-weight:600;font-size:10.5px;padding:2px 8px;border-radius:7px}
.subsource .tagd.th{background:color-mix(in srgb,var(--w4) 18%,transparent);color:var(--w4)}
.subsource .tagd.ai{background:var(--gold-soft);color:var(--gold)}
.transport{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.transport button{border:1px solid var(--line);background:var(--surface);border-radius:11px;height:42px;padding:0 15px;display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:500;font-size:13.5px;color:var(--ink)}
.transport button.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.transport .spacer{flex:1}
.toggle[aria-pressed="true"]{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 34%,transparent);color:var(--gold)}
.reader{margin-top:20px;padding:26px 24px;background:var(--surface-2);border-radius:16px;border:1px solid var(--line)}
.reader .kicker{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:16px;flex-wrap:wrap}
.reader .kicker .hint{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--gold)}
.line{font-family:var(--font-thai);font-weight:500;font-size:42px;line-height:1.85;text-align:center;word-break:break-word}
.tok{position:relative;border-radius:10px;padding:2px 2px;transition:background .16s,color .16s,transform .12s;cursor:pointer;border:none;background:none;font:inherit;color:inherit}
.tok:hover,.tok:focus-visible{transform:translateY(-2px)}
.line.reveal .tok,.line:hover .tok{padding:2px 7px}
.line.reveal .tok[data-c="0"],.line:hover .tok[data-c="0"]{background:color-mix(in srgb,var(--w0) calc(var(--w-alpha)*100%),transparent);color:var(--w0)}
.line.reveal .tok[data-c="1"],.line:hover .tok[data-c="1"]{background:color-mix(in srgb,var(--w1) calc(var(--w-alpha)*100%),transparent);color:var(--w1)}
.line.reveal .tok[data-c="2"],.line:hover .tok[data-c="2"]{background:color-mix(in srgb,var(--w2) calc(var(--w-alpha)*100%),transparent);color:var(--w2)}
.line.reveal .tok[data-c="3"],.line:hover .tok[data-c="3"]{background:color-mix(in srgb,var(--w3) calc(var(--w-alpha)*100%),transparent);color:var(--w3)}
.line.reveal .tok[data-c="4"],.line:hover .tok[data-c="4"]{background:color-mix(in srgb,var(--w4) calc(var(--w-alpha)*100%),transparent);color:var(--w4)}
.line.reveal .tok[data-c="5"],.line:hover .tok[data-c="5"]{background:color-mix(in srgb,var(--w5) calc(var(--w-alpha)*100%),transparent);color:var(--w5)}
.tok:hover{outline:1.5px solid currentColor}
.tok.active{background:var(--ink)!important;color:var(--surface)!important}
.reader .trans{margin-top:16px;text-align:center;color:var(--ink-soft);font-size:15px;padding-top:14px;border-top:1px dashed var(--line)}
.reader .trans.hidden-t{filter:blur(5px);opacity:.6;user-select:none;cursor:pointer}
.reader .trans small{display:block;font-size:11px;color:var(--ink-faint);margin-top:3px;text-transform:uppercase;letter-spacing:.08em;filter:none}

.side{position:sticky;top:88px;display:flex;flex-direction:column;gap:16px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 26px -16px var(--shadow)}
.entry .empty-e{color:var(--ink-faint);font-size:14px;line-height:1.6;text-align:center;padding:18px 6px}
.entry .empty-e .big{font-size:30px;display:block;margin-bottom:8px;font-family:var(--font-thai)}
.entry .head{display:flex;align-items:flex-start;gap:12px}
.entry .word{font-family:var(--font-thai);font-weight:600;font-size:38px;line-height:1.05}
.entry .roman{color:var(--ink-soft);font-size:14.5px;margin-top:3px}
.entry .roman b{color:var(--gold);font-weight:600}
.entry .speak{margin-left:auto;flex:0 0 auto;width:46px;height:46px;border-radius:13px;border:none;background:var(--gold);color:#231a06;display:grid;place-items:center;box-shadow:0 6px 16px -6px var(--gold)}
.entry .pos{display:inline-block;margin-top:14px;font-family:var(--font-display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent);padding:4px 9px;border-radius:8px}
.entry .mean{font-size:21px;font-weight:500;margin:12px 0 0;font-family:var(--font-display)}
.entry .note{color:var(--ink-soft);font-size:13.5px;margin:9px 0 0}
.entry .note:empty{display:none}
.ai{margin-top:16px;border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);border-radius:13px;overflow:hidden}
.ai .ai-btn{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border:none;background:linear-gradient(100deg,var(--gold-soft),transparent);text-align:left}
.ai .ai-btn .spark{width:26px;height:26px;border-radius:8px;background:var(--gold);color:#231a06;display:grid;place-items:center;flex:0 0 auto}
.ai .ai-btn .lab{font-family:var(--font-display);font-weight:600;font-size:13px}
.ai .ai-btn .lab small{display:block;font-weight:400;color:var(--ink-soft);font-size:11px}
.ai .ai-btn .caret{margin-left:auto;transition:transform .2s;color:var(--ink-faint)}
.ai[data-open="true"] .ai-btn .caret{transform:rotate(180deg)}
.ai .ai-body{padding:0 14px;max-height:0;overflow:hidden;transition:max-height .3s,padding .3s;font-size:13.5px;color:var(--ink-soft);line-height:1.6}
.ai[data-open="true"] .ai-body{max-height:400px;padding:2px 14px 14px}
.ai .ai-body .demo{display:inline-block;margin-bottom:6px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint)}
.entry .actions{display:flex;gap:10px;margin-top:16px}
.entry .actions button{flex:1;height:46px;border-radius:12px;font-family:var(--font-display);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.entry .save{background:var(--ink);color:var(--surface);border:none}
.entry .save.saved{background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 34%,transparent)}
.entry .dict{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.saved{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft)}
.saved .pill{margin-left:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--ink)}
.saved .pill b{color:var(--gold)}

/* preferences */
.prefs{max-width:760px;margin:6px auto}
.prefs h2{font-family:var(--font-display);font-size:27px;margin:4px 0 6px;text-wrap:balance}
.prefs .sub{color:var(--ink-soft);margin:0 0 22px;font-size:14.5px;line-height:1.5}
.field-lab{font-family:var(--font-display);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);margin:22px 0 10px}
.langrow{display:flex;gap:9px;flex-wrap:wrap}
.langbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 15px;font-family:var(--font-display);font-weight:500;font-size:13.5px;color:var(--ink)}
.langbtn[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,transparent);color:var(--brand)}
.interests{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.interest{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 15px;text-align:left;font-family:var(--font-display);font-weight:500;font-size:14px;color:var(--ink);transition:border-color .15s,background .15s}
.interest .em{font-size:22px;line-height:1;flex:0 0 auto}
.interest .chk{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;flex:0 0 auto;font-size:13px}
.interest[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent)}
.interest[aria-pressed="true"] .chk{background:var(--brand);border-color:var(--brand);color:#fff}
.prefs-actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.save-prefs{border:none;background:var(--brand);color:#fff;font-family:var(--font-display);font-weight:600;font-size:14px;padding:13px 24px;border-radius:12px}
.skip-prefs{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--font-display);font-weight:500;font-size:14px;padding:13px 20px;border-radius:12px}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><span class="mark">ใบ</span>Bai</div>
  <div class="topsearch">
    <svg width="18" height="18" viewBox="0 0 17 17" fill="none"><circle cx="7.5" cy="7.5" r="5.5" stroke="currentColor" stroke-width="1.7"/><path d="m12 12 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <input id="searchInput" type="search" data-i18n-ph="search_ph" aria-label="Buscar">
  </div>
  <span class="spacer"></span>
  <button class="iconbtn" id="prefsBtn" aria-label="Preferencias" title="Preferencias">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 5h7M13 5h2M3 13h2M8 13h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="5" r="2.1" stroke="currentColor" stroke-width="1.7"/><circle cx="6" cy="13" r="2.1" stroke="currentColor" stroke-width="1.7"/></svg>
  </button>
  <button class="iconbtn" id="themeBtn" aria-label="Tema"></button>
</header>

<main class="wrap">
  <!-- HOME -->
  <section id="homeView">
    <div class="paste">
      <span class="ic" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M6 10 10 6M5.5 3.5 7 2a3 3 0 0 1 4 4l-1.5 1.5M10.5 12.5 9 14a3 3 0 0 1-4-4l1.5-1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span class="txt">
        <b data-i18n="paste_title"></b>
        <input id="pasteInput" type="url" data-i18n-ph="paste_ph" aria-label="YouTube">
      </span>
      <button class="go" id="pasteGo" data-i18n="paste_go"></button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="rowhead"><h3 data-i18n="channels_h"></h3></div>
    <div class="channels" id="channels"></div>
    <div class="rowhead"><h3 data-i18n="foryou_h"></h3><span id="forYouNote"></span></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- PLAYER -->
  <section id="playerView" hidden>

  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=> el.placeholder=t(el.getAttribute('data-i18n-ph')));
  $('#saveBtn') && ($('#saveBtn').innerHTML = (current!=null&&saved.has(LINES[idx].tokens[current].th))?t('saved'):t('save'));
}

/* ---------------- search ---------------- */
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const STOP=new Set(['official','oficial','channel','canal','video','videos','vids','yt','youtube','el','la','de','the','tv']);
function matchesQuery(v,q){ q=norm(q); if(!q) return true; const terms=q.split(' ').filter(x=>x&&!STOP.has(x)); if(!terms.length) return true;
  const hay=norm(v.ti+' '+v.ch+' '+genreLabel(v.genre)+' '+v.genre), words=hay.split(' ');
  return terms.some(x=> hay.includes(x) || words.some(w=>w.startsWith(x)||(x.length>=3&&x.startsWith(w)&&w.length>=3))); }

/* ---------------- home ---------------- */
function renderChips(){
  const c=$('#chips'); c.innerHTML='';
  const items=[{id:'all',label:t('todos')}].concat(GENRES.map(g=>({id:g.id,label:g.emoji+' '+genreLabel(g.id)})));
  items.forEach(it=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=it.label;
    b.setAttribute('aria-pressed',genreFilter===it.id); b.onclick=()=>{ genreFilter=it.id; renderChips(); renderGrid(); }; c.appendChild(b); });
}
function renderChannels(){ const c=$('#channels'); c.innerHTML='';
  CHANNELS.forEach(ch=>{ const d=document.createElement('button'); d.className='channel';
    d.innerHTML='<span class="av" style="background:'+ch.c+'">'+ch.n.slice(0,2)+'</span><small>'+ch.n+'</small>';
    d.onclick=()=>{ $('#searchInput').value=ch.n; renderGrid(); }; c.appendChild(d); }); }
function renderGrid(){
  const q=$('#searchInput').value||''; const g=$('#grid'); g.innerHTML='';
  let list=VIDEOS.filter(v=>matchesQuery(v,q));
  if(genreFilter!=='all') list=list.filter(v=>v.genre===genreFilter);
  else if(prefs&&prefs.size){ const pl=list.filter(v=>prefs.has(v.genre)); if(pl.length) list=pl; }
  // note
  const note=$('#forYouNote');
  if(genreFilter==='all'&&prefs&&prefs.size){ note.innerHTML=t('foryou_prefs')+' · <button class="link" id="editPrefs">'+t('edit')+'</button>'; $('#editPrefs').onclick=openPrefs; }
  else note.textContent=t('foryou_all');
  if(!list.length){ g.innerHTML='<div class="empty">— · —</div>'; return; }
  list.forEach(v=>{ const b=document.createElement('button'); b.className='card';
    const subsTag=v.subs==='th'?'<span class="subs th">✓ '+t('tag_th')+'</span>':'<span class="subs ai">✦ '+t('tag_ai')+'</span>';
    const img=v.id?'<img class="th-img" src="https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">':'';
    b.innerHTML='<div class="thumb"><div class="g" style="background:'+v.g+'"></div>'+img+'<span class="lvl">'+v.lvl+'</span>'+subsTag+'<span class="dur">'+v.dur+'</span></div>'+
      '<div class="ti">'+v.ti+'</div><div class="ch">'+v.ch+' · '+genreLabel(v.genre)+'</div>';
    b.onclick=()=>openPlayer(v); g.appendChild(b); });
}

/* ---------------- views ---------------- */
function showView(w){ homeView.hidden=w!=='home'; playerView.hidden=w!=='player'; prefsView.hidden=w!=='prefs'; window.scrollTo(0,0); }
function openPlayer(v){
  $('#ytChannel').textContent=v.ch;
  const panel=$('.video'),holder=$('#ytHolder');
  if(v.id){ panel.classList.add('real');
    holder.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+v.id+'?cc_load_policy=1&cc_lang_pref=th&hl=th&rel=0&modestbranding=1" title="'+(v.ti||'')+'" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe>';
    $('#subsource').innerHTML='<span class="tagd th">'+t('tag_real')+'</span> '+t('ss_real')+' <a href="https://www.youtube.com/watch?v='+v.id+'" target="_blank" rel="noopener">'+t('open_yt')+'</a>';
  }else{ panel.classList.remove('real'); holder.innerHTML='';
    $('#subsource').innerHTML = v.subs==='th'?'<span class="tagd th">'+t('tag_th')+'</span> '+t('ss_th'):'<span class="tagd ai">'+t('tag_ai')+'</span> '+t('ss_ai'); }
  idx=0; clearEntry(); renderLine(); showView('player');
}
$('#backBtn').onclick=()=>showView('home');
$('#pasteGo').onclick=()=>{ const id=parseYouTubeId($('#pasteInput').value); if(!id){ $('#pasteInput').value=''; $('#pasteInput').focus(); return; }
  openPlayer({id,ti:'YouTube',ch:'YouTube',genre:'vlog',subs:'th'}); };
$('#pasteInput').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#pasteGo').click(); });

/* ---------------- reader ---------------- */
const lineEl=$('#line'),transEl=$('#trans'),capEl=$('#caption'),sceneEl=$('#scene');
function renderLine(){
  const L=LINES[idx],gl=glossLang(); lineEl.innerHTML=''; lineEl.classList.toggle('reveal',breaks);
  L.tokens.forEach((tk,i)=>{ const b=document.createElement('button'); b.className='tok'; b.dataset.c=i%6; b.textContent=tk.th;
    b.setAttribute('aria-label',tk.th+', '+tk.m[gl]); b.onclick=()=>showEntry(i,b); lineEl.appendChild(b); });
  capEl.innerHTML=L.tokens.map(x=>x.th).join('')+'<span class="cap-en">'+L.tr[gl]+'</span>';
  transEl.innerHTML=L.tr[gl]+'<small>'+t('trans_label')+'</small>';
  sceneEl.style.background=L.scene+',radial-gradient(120% 80% at 78% 18%,rgba(233,168,60,.5),transparent 55%),radial-gradient(120% 90% at 12% 92%,rgba(222,104,92,.5),transparent 52%)';
  $('#hintText').textContent = breaks?t('hint_on'):t('hint_off');
}

/* ---------------- dictionary panel ---------------- */
const aiBox=$('#aiBox');
function clearEntry(){ current=null; $('#entryContent').hidden=true; $('#entryEmpty').hidden=false; document.querySelectorAll('.tok.active').forEach(e=>e.classList.remove('active')); }
function showEntry(i,btn){ current=i; const gl=glossLang();
  document.querySelectorAll('.tok.active').forEach(e=>e.classList.remove('active')); if(btn) btn.classList.add('active');
  const tk=LINES[idx].tokens[i];
  $('#eWord').textContent=tk.th; $('#eRoman').innerHTML='<b>'+tk.roman+'</b> · '+t(tk.tone);
  $('#ePos').textContent=t(tk.pos); $('#eMean').textContent=tk.m[gl]; $('#eNote').textContent=tk.n[gl]||'';
  $('#aiText').textContent=LINES[idx].ai[gl]; aiBox.dataset.open='false';
  const sBtn=$('#saveBtn'); sBtn.classList.toggle('saved',saved.has(tk.th)); sBtn.textContent=saved.has(tk.th)?t('saved'):t('save');
  $('#entryEmpty').hidden=true; $('#entryContent').hidden=false;
}
$('#aiBtn').onclick=()=>{ aiBox.dataset.open=aiBox.dataset.open==='true'?'false':'true'; };
$('#saveBtn').onclick=()=>{ if(current==null) return; const key=LINES[idx].tokens[current].th,sBtn=$('#saveBtn');
  if(saved.has(key)){ saved.delete(key); sBtn.classList.remove('saved'); sBtn.textContent=t('save'); } else { saved.add(key); sBtn.classList.add('saved'); sBtn.textContent=t('saved'); }
  $('#savedCount').textContent=saved.size; persist(); };
$('#dictBtn').onclick=()=>{ const tk=LINES[idx].tokens[current],gl=glossLang(); $('#eNote').textContent=(tk.n[gl]?tk.n[gl]+'  ':'')+t('dict_note'); };
$('#speakBtn').onclick=()=>{ if(current==null) return; try{ const u=new SpeechSynthesisUtterance(LINES[idx].tokens[current].th); u.lang='th-TH'; u.rate=.85; const v=speechSynthesis.getVoices().find(v=>/th/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} };

/* ---------------- controls ---------------- */
$('#breakBtn').onclick=e=>{ breaks=!breaks; e.currentTarget.setAttribute('aria-pressed',breaks); lineEl.classList.toggle('reveal',breaks); $('#hintText').textContent=breaks?t('hint_on'):t('hint_off'); };
$('#nextBtn').onclick=()=>{ idx=(idx+1)%LINES.length; clearEntry(); renderLine(); };
$('#prevBtn').onclick=()=>{ idx=(idx-1+LINES.length)%LINES.length; clearEntry(); renderLine(); };
$('#repeatBtn').onclick=()=>{ if(current!=null) $('#speakBtn').click(); };
transEl.onclick=()=>transEl.classList.toggle('hidden-t');
$('#searchInput').addEventListener('input',renderGrid);

/* ---------------- preferences ---------------- */
function renderLangRow(){ const c=$('#langRow'); c.innerHTML='';
  LANGS.forEach(([id,lab])=>{ const b=document.createElement('button'); b.className='langbtn';
    b.textContent = id==='auto'?t('lang_auto'):lab; b.setAttribute('aria-pressed',langPref===id);
    b.onclick=()=>{ langPref=id; try{ localStorage.setItem('bai_lang',id); }catch(e){} lang=langPref==='auto'?detectLang():langPref; applyLangEverywhere(); renderLangRow(); renderInterests(); }; c.appendChild(b); }); }
function renderInterests(){ const c=$('#interests'); c.innerHTML='';
  GENRES.forEach(g=>{ const b=document.createElement('button'); b.className='interest'; b.setAttribute('aria-pressed',draft.has(g.id));
    b.innerHTML='<span class="em">'+g.emoji+'</span>'+genreLabel(g.id)+'<span class="chk">✓</span>';
    b.onclick=()=>{ if(draft.has(g.id)) draft.delete(g.id); else draft.add(g.id); b.setAttribute('aria-pressed',draft.has(g.id)); }; c.appendChild(b); }); }
function openPrefs(){ draft=new Set(prefs||[]); renderLangRow(); renderInterests(); showView('prefs'); }
$('#prefsBtn').onclick=openPrefs;
$('#savePrefs').onclick=()=>{ prefs=new Set(draft); try{ localStorage.setItem('bai_prefs',JSON.stringify([...prefs])); }catch(e){} renderGrid(); showView('home'); };
$('#skipPrefs').onclick=()=>{ if(prefs===null){ prefs=new Set(); try{ localStorage.setItem('bai_prefs','[]'); }catch(e){} } renderGrid(); showView('home'); };

/* ---------------- theme ---------------- */
const SUN='<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="3.6" stroke="currentColor" stroke-width="1.6"/><path d="M9 .8v2.2M9 15v2.2M.8 9H3M15 9h2.2M3.2 3.2 4.8 4.8M13.2 13.2l1.6 1.6M14.8 3.2 13.2 4.8M4.8 13.2 3.2 14.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const MOON='<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M15 10.5A6.5 6.5 0 1 1 7.5 3a5 5 0 0 0 7.5 7.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const themeBtn=$('#themeBtn');
function systemDark(){ try{ return matchMedia('(prefers-color-scheme:dark)').matches; }catch(e){ return false; } }
function currentTheme(){ return document.documentElement.getAttribute('data-theme')||(systemDark()?'dark':'light'); }
function applyTheme(x){ document.documentElement.setAttribute('data-theme',x); themeBtn.innerHTML=x==='dark'?SUN:MOON; }
function initTheme(){ let s=null; try{ s=localStorage.getItem('bai_theme'); }catch(e){} applyTheme(s||currentTheme()); }
themeBtn.onclick=()=>{ const n=currentTheme()==='dark'?'light':'dark'; applyTheme(n); try{ localStorage.setItem('bai_theme',n); }catch(e){} };
try{ matchMedia('(prefers-color-scheme:dark)').addEventListener('change',e=>{ let s=null; try{ s=localStorage.getItem('bai_theme'); }catch(_){} if(!s) applyTheme(e.matches?'dark':'light'); }); }catch(e){}

/* ---------------- apply language everywhere ---------------- */
function applyLangEverywhere(){ translateStatic(); renderChips(); renderGrid(); renderLine(); if(current!=null) showEntry(current); }

/* ---------------- init ---------------- */
initTheme(); translateStatic(); renderChips(); renderChannels(); renderGrid(); renderLine(); renderLangRow(); renderInterests();
if(prefs===null) openPrefs(); else showView('home');
</script>
</body>
</html>
